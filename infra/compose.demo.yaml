name: sivee-demo
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: sivee_demo
      POSTGRES_USER: sivee_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:demo first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sivee_pg_demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivee_owner -d sivee_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  sivee_pg_demo:
